services:
  postgres:
    image: postgres:17
    container_name: v-integrity-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER} # Superuser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Custom env vars for init script
      - POSTGRES_OWNER_USER=${POSTGRES_OWNER_USER}
      - POSTGRES_OWNER_PASSWORD=${POSTGRES_OWNER_PASSWORD}
      - POSTGRES_APP_USER=${POSTGRES_APP_USER}
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # - postgres-data:/var/lib/postgresql/data # Disabled for dev iteration
      - ./docker/postgres/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh
    networks:
      - blockchain-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Ephemeral container to run database migrations
  # Uses OWNER credentials (DDL permissions)
  flyway-migrator:
    image: flyway/flyway:10
    container_name: v-integrity-migrator
    command: -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB} -user=${POSTGRES_OWNER_USER} -password=${POSTGRES_OWNER_PASSWORD} -connectRetries=60 -schemas=ledger migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql
    networks:
      - blockchain-net
    depends_on:
      postgres:
        condition: service_healthy

  node-1:
    build: .
    container_name: v-integrity-node-1
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - LEDGER_NODE_NODEID=node-1
      - LEDGER_NODE_LEADER=true
      - LEDGER_NODE_PEERS=http://node-2:8082,http://node-3:8083
      # Secrets loaded from local .env file
      - LEDGER_PRIVATE_KEY_BASE64=${LEDGER_PRIVATE_KEY_BASE64}
      - LEDGER_NODE1_PUBLIC_KEY_BASE64=${LEDGER_NODE1_PUBLIC_KEY_BASE64}
      # Database Configuration (Uses APP credentials - DML only)
      # Use DOCKER_DATASOURCE_URL from .env to override SPRING_DATASOURCE_URL
      - SPRING_DATASOURCE_URL=${DOCKER_DATASOURCE_URL}
      - POSTGRES_APP_USER=${POSTGRES_APP_USER}
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
    networks:
      - blockchain-net
    depends_on:
      postgres:
        condition: service_healthy
      flyway-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  node-2:
    build: .
    container_name: v-integrity-node-2
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - LEDGER_NODE_NODEID=node-2
      - LEDGER_NODE_LEADER=false
      - LEDGER_NODE_PEERS=http://node-1:8081
      # Node 2 needs public key to verify blocks
      - LEDGER_NODE1_PUBLIC_KEY_BASE64=${LEDGER_NODE1_PUBLIC_KEY_BASE64}
      # Database Configuration (Uses APP credentials - DML only)
      - SPRING_DATASOURCE_URL=${DOCKER_DATASOURCE_URL}
      - POSTGRES_APP_USER=${POSTGRES_APP_USER}
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
    networks:
      - blockchain-net
    depends_on:
      node-1:
        condition: service_healthy
      postgres:
        condition: service_healthy
      flyway-migrator:
        condition: service_completed_successfully

  node-3:
    build: .
    container_name: v-integrity-node-3
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - LEDGER_NODE_NODEID=node-3
      - LEDGER_NODE_LEADER=false
      - LEDGER_NODE_PEERS=http://node-1:8081
      # Node 3 needs public key to verify blocks
      - LEDGER_NODE1_PUBLIC_KEY_BASE64=${LEDGER_NODE1_PUBLIC_KEY_BASE64}
      # Database Configuration (Uses APP credentials - DML only)
      - SPRING_DATASOURCE_URL=${DOCKER_DATASOURCE_URL}
      - POSTGRES_APP_USER=${POSTGRES_APP_USER}
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
    networks:
      - blockchain-net
    depends_on:
      node-1:
        condition: service_healthy
      postgres:
        condition: service_healthy
      flyway-migrator:
        condition: service_completed_successfully

networks:
  blockchain-net:
    driver: bridge

volumes:
  postgres-data:
