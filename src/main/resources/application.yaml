server:
  port: 8081

spring:
  application:
    name: v-integrity
  mvc:
    problem-details:
      enabled: true
  jackson:
    time-zone: UTC
  datasource:
    # URL must be provided via environment variable SPRING_DATASOURCE_URL
    # Example Local: jdbc:postgresql://localhost:5432/ledger
    # Example Docker: jdbc:postgresql://postgres:5432/ledger
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER:ledger}
    password: ${POSTGRES_PASSWORD:ledger}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        ddl-auto: validate
        jdbc:
          time_zone: UTC
  flyway:
    # Disable auto-migration on startup. Migrations are handled by an external process (Docker/CI).
    enabled: false

logging:
  level:
    root: INFO
    xavierroigmartin.v_integrity: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

ledger:
  node:
    nodeId: "node-1"
    leader: true
    peers:
      - "http://localhost:8082"
      - "http://localhost:8083"

    # SOLO leader: privateKeyBase64 (PKCS#8)
    # SECURITY: Never hardcode private keys. Use environment variable LEDGER_PRIVATE_KEY_BASE64
    privateKeyBase64: "${LEDGER_PRIVATE_KEY_BASE64:}"

    # Allowlist de nodos autorizados para proponer bloques (en PoC, solo el líder)
    allowedNodePublicKeys:
      node-1: "${LEDGER_NODE1_PUBLIC_KEY_BASE64:}"
